[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "good-mcp"
version = "1.0.0"
description = "Wohlverhaltener MCP-Selftest-Server mit FastMCP und CLI-Kern"
requires-python = ">=3.10"
dependencies = ["mcp>=1.20,<2"]

[project.scripts]
good-mcp = "good_mcp.server:main"
good-cli = "good_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
